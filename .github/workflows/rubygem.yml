# This workflow uses actions that are not certified by GitHub.  They are
# provided by a third-party and are governed by separate terms of service,
# privacy policy, and support documentation.
#
# This workflow will install a prebuilt Ruby version, install dependencies, and
# run tests and linters.
name: "Ruby Gem CI"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.1', '3.2', '3.3']

    name: Teste (Ruby ${{ matrix.ruby-version }})
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Ruby e gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # Instala as dependências via "bundle install"

      - name: Rodar testes (RSpec)
        run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Ruby e gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Use uma versão recente para o lint
          bundler-cache: true

      - name: Auditoria de segurança das dependências
        run: bundle exec bundler-audit check --update

      - name: Análise de estilo do código (RuboCop)
        run: bundle exec rubocop
